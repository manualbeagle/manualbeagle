name: Bug
description: Something other than a brand adapter doesn't work as documented.
title: "Bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        For a security problem, don't open an issue: see [SECURITY.md](https://github.com/manualbeagle/manualbeagle/blob/main/SECURITY.md).
        Please remove API keys, private addresses and anything else private from what you paste.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The command you ran and its full output.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce it
      description: Steps, and the relevant part of your config.toml (without secrets).
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: "`manualbeagle --version`, or `git rev-parse --short HEAD`."
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and Python version
      placeholder: "Ubuntu 24.04, Python 3.12"
    validations:
      required: true
